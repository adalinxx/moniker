<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moniker</title>
<meta name="description" content="Own your name on the internet: an @handle you keep, shown on your account in every app.">
<link rel="icon" href="./brand/favicon.ico" sizes="any">
<link rel="icon" href="./brand/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Public Sans"; font-weight: 400 600; font-display: swap; src: url(./fonts/public-sans.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(./fonts/jetbrains-mono-400.woff2) format("woff2"); }
:root {
  --bg: #f3f1ec; --surface: #ffffff; --ink: #16181d; --soft: #2e323a; --muted: #4a4f5a; --line: #dad7cf; --hair: #ecEAe4;
  --accent: #1f3fbf; --accent-ink: #ffffff; --bad: #9a3324; --bad-soft: #f7e4df; --avatar: #cfd6ef;
  --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b; --surface: #1f2228; --ink: #f1f0ec; --soft: #d9d8d3; --muted: #a9adb6; --line: #343842; --hair: #2a2d34;
    --accent: #8fa6ff; --accent-ink: #10131c; --bad: #ff9a85; --bad-soft: #3a211c; --avatar: #343c5c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; }
.col { width: 100%; max-width: 560px; }
.brand-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
.brand-home { display: inline-flex; align-items: center; flex-shrink: 0; min-height: 44px; }
.brand-home img { display: block; width: 157.2px; height: 40px; }
@media (max-width: 400px) { .brand-home img { width: 118px; height: 30px; } }
.top-nav { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.top-nav a:not(.pill) { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 15px; padding: 10px 10px; min-height: 44px; display: inline-flex; align-items: center; }
.result { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 8px; }
.result h1 { margin: 4px 0 0; font-size: clamp(26px, 6vw, 34px); font-weight: 400; }
.result.available, .result.sale { border-color: var(--accent); }
.result-end { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.result-end .pill { min-height: 52px; padding: 0 24px; font-size: 16px; }
.badge { align-self: flex-start; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--hair); color: var(--soft); }
.result.available .badge, .result.sale .badge { background: var(--accent); color: var(--accent-ink); }
.price { font-weight: 600; font-variant-numeric: tabular-nums; }
.price.big { font-size: 28px; }
.order { margin: 0; font-size: 22px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; color: var(--soft); }
.top { display: flex; justify-content: flex-end; gap: 8px; min-height: 44px; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); cursor: pointer; font-weight: 500; }
.pill.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill[disabled] { opacity: 0.55; cursor: default; }
.icon { width: 44px; padding: 0; border-color: transparent; background: transparent; }
.card { text-align: center; display: flex; flex-direction: column; align-items: center; margin-top: 16px; }
h1 { margin: 20px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
.bio { margin: 14px 0 0; max-width: 44ch; color: var(--soft); white-space: pre-line; overflow-wrap: anywhere; }
footer { margin-top: auto; padding-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
footer nav { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
footer nav a, .quiet { color: var(--muted); font-size: 13px; text-decoration: none; padding: 10px 8px; }
.copy { border: 0; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 13px; min-height: 44px; padding: 0 12px; border-radius: 999px; cursor: pointer; }
.box { display: flex; align-items: center; min-height: 60px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); padding: 0 8px 0 22px; gap: 8px; }
.box input { flex: 1; min-width: 0; height: 56px; border: 0; outline: none; background: transparent; font-family: var(--mono); font-size: 17px; }
.box:focus-within { border-color: var(--ink); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 60px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); padding: 8px 8px 8px 22px; }
.row .end { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section { margin-top: 32px; }
.note { margin: 0 22px; font-size: 14px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: 14px; color: var(--muted); }
.field input, .field textarea, .field select { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.field textarea { resize: vertical; line-height: 1.5; }
dialog { border: 0; border-radius: 24px; padding: 24px; width: min(480px, calc(100% - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(22, 24, 29, 0.45); }
dialog h2 { font-size: 20px; }
dialog p { color: var(--soft); }
dialog .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; display: flex; gap: 12px; align-items: center; z-index: 10; }
.toast.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.toast button { border: 0; background: transparent; color: inherit; min-width: 32px; min-height: 32px; cursor: pointer; font-size: 18px; }
.empty { color: var(--muted); text-align: center; margin-top: 48px; }
button.link { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; min-height: 0; }
h1.account { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: 8px 0 0; }
h1.account .label { font-size: 14px; font-weight: 400; color: var(--muted); }
.account-page > .copy { min-width: 44px; font-family: var(--body); text-decoration: underline; }
h1.account .mono { font-size: 0.85em; font-weight: 600; }
.account-page .names { align-self: stretch; display: flex; flex-direction: column; gap: 8px; margin-top: 32px; }
.account-page .names h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0 0 4px; text-align: left; }
.account-page .names .row { text-align: left; }
.account-page .names .empty { margin-top: 8px; }
.start { margin-top: 12vh; }
.hero { margin: 0; font-size: clamp(30px, 7vw, 40px); line-height: 1.12; letter-spacing: -0.02em; }
.lede { margin: 0; color: var(--soft); }
.start .lede { margin-top: 14px; }
.pill.big { min-height: 56px; width: 100%; box-sizing: border-box; font-size: 16px; }
.promises { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; color: var(--soft); font-size: 15px; line-height: 1.45; }
.promises b { color: var(--ink); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* A heading focused after a page change marks where to start reading, without a ring. */
h1[tabindex="-1"]:focus { outline: none; }
.toast span { overflow-wrap: anywhere; }
.choices { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; }
.choices .pill { justify-content: flex-start; }
.pill.bad { color: var(--bad); }
.pill.danger { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.owned { margin: 0; color: var(--soft); }
.shows { margin: 8px 0 0; color: var(--soft); }
#shows, .shows { overflow-wrap: anywhere; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--soft); }
.check input { width: 20px; height: 20px; margin: 0; }
button.quiet { min-height: 44px; }
h1.empty { font-size: 18px; font-weight: 400; }
</style>
<script type="module" src="./app.js"></script>
</head>
<body>
<div id="app" class="page"></div>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toasts" role="status"></div>
<div id="alerts" role="alert"></div>
</body>
</html>
