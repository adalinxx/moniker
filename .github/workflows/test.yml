name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_runs:
        description: Random transactions per property test
        default: "20000"

# The other repositories these tests run against, pinned to commits the suites
# pass on. Move a pin on purpose, in its own commit, after running the suites.
env:
  RUST_TOOLCHAIN: "1.96.0"
  NODE_VERSION: "24"
  LATTICE_NODE_REPO: 0xLattice/lattice-node
  LATTICE_NODE_REF: 131bcbbbcb8b194bea3533cf35bccdff6b185b6c # lattice-sponsor (#20)
  LATTICE_SDK_REPO: 0xLattice/lattice-sdk
  LATTICE_SDK_REF: 72157a68271e97ad55571ae08387f0c814758acf
  LATTICE_WALLET_REPO: adalinxx/selfhold-wallet
  LATTICE_WALLET_REF: 114f949ab60b10f28540fb4235a1eb1cc9188697 # page writes may ask no fee (selfhold-wallet#23)

jobs:
  policy:
    name: Policy and moniker-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_SDK_REPO }}
          ref: ${{ env.LATTICE_SDK_REF }}
          path: .deps/lattice-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Build the Lattice SDK
        working-directory: .deps/lattice-sdk
        run: npm ci && npm run build
      - name: Build the policy
        run: cargo build --release --target wasm32-unknown-unknown -p moniker-policy
      # Built here, in a path unlike any developer's, the module is still the
      # committed bytes, and names no machine: the chain carries it for good.
      - name: The committed module is the one this source builds
        run: cmp policy/target/wasm32-unknown-unknown/release/moniker_policy.wasm chain/moniker_policy.wasm
      - name: The module names no build path
        run: "! strings -n 4 chain/moniker_policy.wasm | grep -E '^/|/home/|/Users/|\\\\'"
      - name: Policy tests
        working-directory: policy
        env:
          LATTICE_SDK_CORE: ${{ github.workspace }}/.deps/lattice-sdk/packages/core/dist/index.js
          CONTEXT_DIR: ${{ github.workspace }}/contexts
        run: node --test test/policy.test.mjs
      - name: Policy property tests
        working-directory: policy
        env:
          LATTICE_SDK_CORE: ${{ github.workspace }}/.deps/lattice-sdk/packages/core/dist/index.js
          FUZZ_RUNS: ${{ inputs.fuzz_runs || '20000' }}
          FUZZ_SEED: ${{ github.run_id }}
          CONTEXT_DIR: ${{ github.workspace }}/contexts
        run: node --test test/properties.test.mjs
      # Every context those tests judged, with its verdict, for the engine job.
      - run: tar -czf contexts.tar.gz contexts chain/moniker_policy.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: contexts
          path: contexts.tar.gz
          retention-days: 3
      - name: moniker-sdk against this policy
        working-directory: sdk
        env:
          LATTICE_SDK: ${{ github.workspace }}/.deps/lattice-sdk/packages/sdk/dist/index.js
          MONIKER_WASM: ${{ github.workspace }}/chain/moniker_policy.wasm
        run: npm test

  engine:
    name: The node's engine agrees
    needs: policy
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contexts
      - name: Build host-check
        run: |
          apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
          swift build -c release --package-path policy/host-check
      # The policy is fixed at genesis, so the node's WasmKit must give every
      # verdict the tests' engine gave.
      - name: Replay every context through Lattice's own host
        shell: bash # pipefail: a mismatch fails the step through tee
        run: |
          tar -xzf contexts.tar.gz
          policy/host-check/.build/release/host-check chain/moniker_policy.wasm contexts | tee replay.txt
      # The chain is created from these, and people check the module by them.
      - name: The specs and the README name the module the node computes
        shell: bash
        run: |
          cid=$(sed -n 's/^module \([^ ]*\) .*/\1/p' replay.txt)
          test -n "$cid"
          for spec in chain/spec.json e2e/ui/spec.json; do
            grep -q "\"moduleCID\": \"$cid\"" "$spec" || { echo "$spec does not name $cid"; exit 1; }
          done
          grep -q "\`$cid\`" README.md || { echo "README.md does not name $cid"; exit 1; }

  node:
    name: Build the Lattice node
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    timeout-minutes: 90
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: bin
          key: lattice-node-${{ env.LATTICE_NODE_REF }}-static-2
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_NODE_REPO }}
          ref: ${{ env.LATTICE_NODE_REF }}
          path: lattice-node
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
          cd lattice-node
          # Static Swift runtime, so the binaries run on a plain runner. The
          # lattice command runs the node, the miner and its coordinator from
          # beside it; the UI tests run lattice-sponsor from there too.
          swift build --static-swift-stdlib
          mkdir ../bin
          cp "$(swift build --static-swift-stdlib --show-bin-path)"/{lattice,lattice-node,lattice-miner,lattice-mining-coordinator,lattice-sponsor} ../bin/
      - uses: actions/upload-artifact@v4
        with:
          name: lattice
          path: bin
          retention-days: 3

  e2e:
    name: ${{ matrix.suite == 'ui' && 'UI acceptance' || 'End to end' }}
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [protocol, ui]
    env:
      LATTICE: ${{ github.workspace }}/.deps/bin/lattice
      LATTICE_SDK: ${{ github.workspace }}/.deps/lattice-sdk/packages/sdk/dist/index.js
      LATTICE_WALLET: ${{ github.workspace }}/.deps/lattice-wallet/dist
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_SDK_REPO }}
          ref: ${{ env.LATTICE_SDK_REF }}
          path: .deps/lattice-sdk
      - uses: actions/download-artifact@v4
        with:
          name: lattice
          path: .deps/bin
      # The node links the Swift runtime in, but not these.
      - run: chmod +x .deps/bin/* && sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-0 libcurl4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Build the Lattice SDK
        working-directory: .deps/lattice-sdk
        run: npm ci && npm run build
      - name: Build the policy
        run: cargo build --release --target wasm32-unknown-unknown -p moniker-policy

      - if: matrix.suite == 'protocol'
        name: Moniker against a real node
        run: node e2e/moniker.mjs

      - if: matrix.suite == 'ui'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LATTICE_WALLET_REPO }}
          ref: ${{ env.LATTICE_WALLET_REF }}
          path: .deps/lattice-wallet
          submodules: true
      - if: matrix.suite == 'ui'
        name: Build Selfhold
        working-directory: .deps/lattice-wallet
        run: npm ci && npm run build
      - if: matrix.suite == 'ui'
        name: Install Playwright
        working-directory: e2e/ui
        run: npm ci && npx playwright install --with-deps chromium
      - if: matrix.suite == 'ui'
        name: The page in Chromium with Selfhold
        working-directory: e2e/ui
        run: npm test

      - if: failure()
        name: The node's logs
        run: |
          for f in $(find "${RUNNER_TEMP:-/tmp}" /tmp -path '*moniker-*' -name '*.log' 2>/dev/null | sort -u); do
            echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"
          done
